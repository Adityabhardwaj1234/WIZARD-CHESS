[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wizards-chess-models"
version = "3.1.0"
description = "Wizard's Chess V3 Cathedral Evolution — Neural Network & Classical Evaluation Model Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wizard's Chess Engineering" }]
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
